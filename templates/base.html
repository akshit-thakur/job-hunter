<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/app.css') }}?v=20260815-1" rel="stylesheet">
  </head>
  <body{% block body_attrs %}{% endblock %}>
    <nav class="navbar navbar-expand-lg app-nav">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Job Tracker</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/">Dashboard</a>
          <a class="nav-link" href="/applications">Applications</a>
          <a class="nav-link" href="/applications/new">Add</a>
          <a class="nav-link" href="/export.csv">Export CSV</a>
        </div>
      </div>
    </nav>
    <main class="container-fluid py-3">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/app.js') }}?v=20260815-1" defer></script>
  </body>
</html>
