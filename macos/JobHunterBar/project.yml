name: JobHunterBar
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  JobHunterBar:
    type: application
    platform: macOS
    sources:
      - path: JobHunterBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.JobHunterBar
        PRODUCT_NAME: JobHunterBar
        INFOPLIST_FILE: JobHunterBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: JobHunterBar/JobHunterBar.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: true
        CODE_SIGNING_REQUIRED: false
